spring.application.name=iam-platform

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/iam_db
spring.datasource.username=postgres
spring.datasource.password=1231

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080



# JWT configuration
app.jwt.secret=${JWT_SECRET_BASE64:bXktc3VwZXItc2VjcmV0LWtleS1mb3ItbG9jYWwtZGV2ZWxvcG1lbnQtMzI=}
# Access token: 15 minutes
app.jwt.expiration-ms=120000

# Refresh token: 7 days
app.jwt.refresh-expiration-ms=604800000
logging.level.org.springframework.security=TRACE

# Email verification token: 24 hours
app.account.email-verification-expiration-ms=86400000

# Password reset token: 15 minutes
app.account.password-reset-expiration-ms=900000

# Local development URL
app.account.base-url=http://localhost:8080